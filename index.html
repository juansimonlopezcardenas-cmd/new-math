<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Matefacil</title>
        <style>
            
            body { font-family: Arial, Helvetica, sans-serif; background: #008db8; padding: 20px; }
            .chat-container { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
            h2 { margin-top: 0; text-align: center; color: #1a73e8; }
        .chat-box { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 15px; overflow-y: auto; background: #f9f9f9; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
        .mensaje { padding: 10px 15px; border-radius: 8px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .usuario { background: #e3f2fd; align-self: flex-end; color: #0d47a1; border-bottom-right-radius: 2px; }
        .tutor { background: #e8f0fe; align-self: flex-start; color: #1f1f1f; border-left: 4px solid #1a73e8; border-bottom-left-radius: 2px; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; outline: none; }
       input:hover { background: #bdbdbd;}
        button { background: #1ae84e; color: white; border: none; padding: 12px 20px; font-size: 15px; cursor: pointer; border-radius: 5px; font-weight: bold; }
        button:hover { background: #0c7c00; }
        </style>
    </head>
    <body>

<div class="chat-container">
    <h2>MateFacil</h2>
    <p style="font-size: 14px; color: #666; text-align: center;">Escribe tu ecuación inicial o responde a las preguntas del tutor.</p>
    
    <div class="chat-box" id="chatBox">
        <div class="mensaje tutor">¡Hola! Escribe una ecuación (por ejemplo, <i>2x + 4 = 10</i>) para que empecemos a resolverla juntos paso a paso.</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu ecuación o respuesta aquí..." onkeypress="manejarEnter(event)">
        <button onclick="enviarMensaje()">Enviar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
